name: Zerohertz-style Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) 종합 카드 생성 => metrics.full.svg (위 이미지가 참조하는 파일)
      - name: Generate Full Metrics (composite card)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          base: header, activity, community, repositories, metadata
          template: classic
          config_timezone: Asia/Seoul
          config_order: base.header, isocalendar, languages, habits, base.activity

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_activity_limit: 5

          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      # 2) (선택) 입체 잔디만 단독 파일로도 계속 만들고 싶으면 유지
      - name: Generate Isocalendar Only
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
